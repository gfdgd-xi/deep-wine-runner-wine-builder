name: Building ARM Wine 7z Package(WOW64)
run-name: ${{ github.actor }} Building ARM Wine 7z Package(WOW64) 🚀
on:
  push:
  workflow_dispatch:
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Building Wine
        env: 
          GUSER: ${{ secrets.GUSER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          UPLOADURL: ${{ secrets.UPLOADURL }}
        run: |
          # 配置编译容器
          sudo apt update
          sudo apt install qemu-user-static aria2 debootstrap neofetch python3 curl -y
          neofetch
          sudo debootstrap --arch arm64 bullseye ~/debian11-arm64 https://archive.debian.org/debian/
          sudo aria2c -d /usr/bin -o pardus-chroot https://github.com/gfdgd-xi/deep-wine-runner/raw/main/pardus-chroot
          sudo chmod 777 /usr/bin/pardus-chroot
          sudo pardus-chroot ~/debian11-arm64
          # 编译 arm64 wine
          sudo aria2c -d ~/debian11-arm64 -o wineautobuild-action-7z.sh https://github.com/gfdgd-xi/deep-wine-runner/raw/main/wineautobuild-action-7z-wow64-arm64.sh
          git clone https://github.com/gfdgd-xi/auto-building-wine --depth=1
          sudo cp auto-building-wine/ ~ -rv
          sudo cp auto-building-wine/wine-version.txt ~/debian11-arm64 -rv
          sudo cp auto-building-wine/wine-url.txt ~/debian11-arm64 -rv
          sudo cp auto-building-wine/wine-type.txt ~/debian11-arm64 -rv
          sudo chroot ~/debian11-arm64 bash /wineautobuild-action-7z.sh
          # 提交wine
          # 获取数据
          url=`cat ~/auto-building-wine/wine-url.txt`
          version=`cat ~/auto-building-wine/wine-version.txt`
          type=`cat ~/auto-building-wine/wine-type.txt`
          #curl -F "file=@$HOME/debian11-arm64/wine/wine-$type-wow64-$version-debian11-arm64.7z" "$UPLOADURL"
          sudo cp $HOME/debian11-arm64/wine/wine-$type-wow64-$version-debian11-arm64.7z  ~/wine-arm64.7z

          mkdir ~/sourceforge-upload -pv
          sudo cp $HOME/debian11-arm64/wine/wine-$type-wow64-$version-debian11-arm64.7z  ~/sourceforge-upload/wine-$type-wow64-$version-debian11-arm64.7z
          
      - name: upload result(Wine arm64)
        uses: actions/upload-artifact@v4
        with:
          name: wine-wow64-debian11-arm64
          path: /home/runner/wine-arm64.7z

      - name: Config Arm Building Environment
        run: |
          # 使用交叉编译，不使用 Qemu
          sudo chroot ~/debian11-arm64 apt install git gcc-8-aarch64-linux-gnu sudo make cmake -y
          # sudo debootstrap --arch arm64 buster ~/debian11-arm64
          # sudo pardus-chroot ~/debian11-arm64
          # sudo chroot ~/debian11-arm64 apt update
          # sudo chroot ~/debian11-arm64 apt install git sudo make cmake -y

      - name: Build Box64 (arm64)
        run: |
          cpu=$(cat /proc/cpuinfo | grep processor | wc -l)
          sudo chroot ~/debian11-arm64 git clone https://github.com/ptitSeb/box64 --depth=1
          sudo chroot ~/debian11-arm64 bash -c 'cd box64; apt build-dep . -y'
          # 处理 CMakeList 以便可以正常 install
          sudo sed -i "s/NOT _x86 AND NOT _x86_64/true/g" ~/debian11-arm64/box64/CMakeLists.txt
          sudo chroot ~/debian11-arm64 mkdir /install-box64
          sudo chroot ~/debian11-arm64 bash -c 'cd box64; cmake . -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-8'
          sudo chroot ~/debian11-arm64 bash -c "cd box64; make all -j$cpu"
          sudo chroot ~/debian11-arm64 bash -c "cd box64; make install DESTDIR=/install-box64 -j$cpu"

      - name: Pack Arm 7z
        run: |
          cd ~
          git clone https://github.com/gfdgd-xi/auto-building-wine --depth=1 | true
          # 解压
          cd /tmp
          mkdir arm-wine/wine -p
          mkdir arm-wine/bin -p
          cd arm-wine/wine
          7z x /home/runner/wine-arm64.7z
          cd ..
          cp ~/auto-building-wine/wine-run.sh run.sh -rv
          cp ~/auto-building-wine/wine-run-compatible.sh bin/wine -rv
          chmod 777 -Rv run.sh
          chmod 777 -Rv bin/wine
          mkdir -p box64
          cp -rv ~/debian11-arm64/install-box64/etc/box64.box64rc box64
          cp -rv ~/debian11-arm64/install-box64/usr/lib/box64-x86_64-linux-gnu box64
          cp -rv ~/debian11-arm64/install-box64/usr/local/bin/box64 box64
          7z a ~/wine-box64-arm64.7z *

          url=`cat ~/auto-building-wine/wine-url.txt`
          version=`cat ~/auto-building-wine/wine-version.txt`
          type=`cat ~/auto-building-wine/wine-type.txt`
          sudo cp ~/wine-box64-arm64.7z  ~/sourceforge-upload/wine-$type-wow64-box64-$version-debian11-arm64.7z

      - name: upload result(Wine BOX64 ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: wine-wow64-box64-debian11-arm64
          path: /home/runner/wine-box64-arm64.7z

      - name: Config Riscv64 Building Environment
        run: |
            # 使用交叉编译，不使用 Qemu
            sudo chroot ~/debian11-arm64 apt install git gcc-riscv64-linux-gnu sudo make cmake -y

      - name: Build Box64 (riscv64)
        run: |
          cpu=$(cat /proc/cpuinfo | grep processor | wc -l)
          sudo chroot ~/debian11-arm64 rm -rf /box64
          sudo chroot ~/debian11-arm64 rm -rf /install-box64
          sudo chroot ~/debian11-arm64 git clone https://github.com/ptitSeb/box64 --depth=1
          sudo chroot ~/debian11-arm64 bash -c 'cd box64; apt build-dep . -y'
          # 处理 CMakeList 以便可以正常 install
          sudo sed -i "s/NOT _x86 AND NOT _x86_64/true/g" ~/debian11-arm64/box64/CMakeLists.txt
          sudo chroot ~/debian11-arm64 mkdir -p /install-box64
          sudo chroot ~/debian11-arm64 bash -c 'cd box64; cmake . -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc-8'
          sudo chroot ~/debian11-arm64 bash -c "cd box64; make all -j$cpu"
          sudo chroot ~/debian11-arm64 bash -c "cd box64; make install DESTDIR=/install-box64 -j$cpu"

      - name: Pack Riscv64 7z
        run: |
          cd ~
          # 解压
          cd /tmp
          mkdir riscv-wine/wine -p
          mkdir riscv-wine/bin -p
          cd riscv-wine/wine
          7z x /home/runner/wine-arm64.7z
          cd ..
          cp ~/auto-building-wine/wine-run.sh run.sh -rv
          cp ~/auto-building-wine/wine-run-compatible.sh bin/wine -rv
          chmod 777 -Rv run.sh
          chmod 777 -Rv bin/wine
          mkdir -p box64
          cp -rv ~/debian11-arm64/install-box64/etc/box64.box64rc box64
          cp -rv ~/debian11-arm64/install-box64/usr/lib/box64-x86_64-linux-gnu box64
          cp -rv ~/debian11-arm64/install-box64/usr/local/bin/box64 box64
          7z a ~/wine-box64-riscv64.7z *

          url=`cat ~/auto-building-wine/wine-url.txt`
          version=`cat ~/auto-building-wine/wine-version.txt`
          type=`cat ~/auto-building-wine/wine-type.txt`
          sudo cp ~/wine-box64-riscv64.7z  ~/sourceforge-upload/wine-$type-wow64-box64-$version-debian11-riscv64.7z

      - name: upload result(Wine BOX64 riscv64)
        uses: actions/upload-artifact@v4
        with:
          name: wine-wow64-box64-debian11-riscv64
          path: /home/runner/wine-box64-riscv64.7z

      - name: upload sourceforge
        env: 
          SOURCEFORGEPASSWD: ${{ secrets.SOURCEFORGEPASSWD }}
          GITHUBPASSWORD: ${{ secrets.GITHUBPASSWORD }}
        run: |
          sudo apt install rsync sshpass -y
          cd ~/sourceforge-upload
          python3 ~/auto-building-wine/auto-upload-config.py $SOURCEFORGEPASSWD $GITHUBPASSWORD wine-*debian11*.7z
  
